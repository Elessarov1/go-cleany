spring:
  datasource:
    url: ${cleany.postgres.url}
    username: ${cleany.postgres.username}
    password: ${cleany.postgres.password}
    driverClassName: org.postgresql.Driver

  jpa:
    show-sql: true

  liquibase:
    enabled: true
    database-change-log-table: cleany_changelog
    database-change-log-lock-table: cleany_changelog_lock

server:
  servlet:
    session:
      cookie:
        secure: false

cleany:
  postgres:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cleany?ApplicationName=cleany}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  local-auth:
    telegram-user-id: ${LOCAL_TELEGRAM_USER_ID:900001}
    username: ${LOCAL_TELEGRAM_USERNAME:browser_preview}
    first-name: ${LOCAL_TELEGRAM_FIRST_NAME:Alex}
    last-name: ${LOCAL_TELEGRAM_LAST_NAME:}
    language-code: ${LOCAL_TELEGRAM_LANGUAGE_CODE:ru}

cleaning:
  # Local visual placeholders only. They are not approved production prices.
  booking-days-ahead: 7
  currency: TRY
  zone-id: Europe/Istanbul
  prices:
    regular:
      studio: 800
      one-plus-one: 900
      two-plus-one: 1100
      three-plus-one: 1350
      four-plus-one: 1650
      duplex-surcharge: 300
    deep:
      studio: 1200
      one-plus-one: 1400
      two-plus-one: 1700
      three-plus-one: 2050
      four-plus-one: 2450
      duplex-surcharge: 450

referral:
  financial:
    commission-rate: ${REFERRAL_COMMISSION_RATE:0.15}
    customer:
      friend-discount-rate: ${REFERRAL_FRIEND_DISCOUNT_RATE:0.15}
      friend-max-discount: ${REFERRAL_FRIEND_MAX_DISCOUNT:2000}
      referrer-reward-rate: ${REFERRAL_REFERRER_REWARD_RATE:0.10}
      referrer-max-discount: ${REFERRAL_REFERRER_MAX_DISCOUNT:2000}
    partner:
      customer-discount-rate: ${REFERRAL_PARTNER_CUSTOMER_DISCOUNT_RATE:0.05}
      customer-max-discount: ${REFERRAL_PARTNER_CUSTOMER_MAX_DISCOUNT:2000}
      payout-rate: ${REFERRAL_PARTNER_PAYOUT_RATE:0.10}
      max-payout: ${REFERRAL_PARTNER_MAX_PAYOUT:2000}

onsite-issue:
  min-photos: ${ONSITE_ISSUE_MIN_PHOTOS:3}
  max-photos: ${ONSITE_ISSUE_MAX_PHOTOS:8}
  max-photo-size: ${ONSITE_ISSUE_MAX_PHOTO_SIZE:5MB}
  supported-content-types: ${ONSITE_ISSUE_SUPPORTED_CONTENT_TYPES:image/jpeg,image/png}

cleaner:
  telegram-ids: ${CLEANER_TELEGRAM_IDS:123456789,987654321}

admin:
  telegram-ids: ${ADMIN_TELEGRAM_IDS:${LOCAL_TELEGRAM_USER_ID:900001}}
  google-emails: ${ADMIN_GOOGLE_EMAILS:}

web-auth:
  google:
    enabled: false

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN:local-not-configured}
  webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
  bot-enabled: ${TELEGRAM_BOT_ENABLED:false}
  update-mode: ${TELEGRAM_UPDATE_MODE:polling}
