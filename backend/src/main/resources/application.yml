spring:
  cache:
    cache-names: platformServiceState
    caffeine:
      spec: maximumSize=64
  application:
    name: cleany

  datasource:
    url: ${cleany.postgres.url}
    username: ${cleany.postgres.username}
    password: ${cleany.postgres.password}
    driverClassName: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true
    database-change-log-table: cleany_changelog
    database-change-log-lock-table: cleany_changelog_lock

  session:
    timeout: ${WEB_SESSION_TIMEOUT:12h}
    jdbc:
      initialize-schema: never

  http:
    clients:
      connect-timeout: ${TELEGRAM_API_CONNECT_TIMEOUT:3s}
      read-timeout: ${TELEGRAM_API_READ_TIMEOUT:35s}
  web:
    error:
      include-stacktrace: never
      include-message: never

server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${WEB_SESSION_COOKIE_SECURE:true}
        same-site: lax

cleany:
  postgres:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

cleaning:
  booking-days-ahead: ${CLEANING_BOOKING_DAYS_AHEAD:7}
  currency: TRY
  zone-id: Europe/Istanbul
  prices:
    regular:
      studio: ${CLEANING_PRICES_REGULAR_STUDIO}
      one-plus-one: ${CLEANING_PRICES_REGULAR_ONE_PLUS_ONE}
      two-plus-one: ${CLEANING_PRICES_REGULAR_TWO_PLUS_ONE}
      three-plus-one: ${CLEANING_PRICES_REGULAR_THREE_PLUS_ONE}
      four-plus-one: ${CLEANING_PRICES_REGULAR_FOUR_PLUS_ONE}
      duplex-surcharge: ${CLEANING_PRICES_REGULAR_DUPLEX_SURCHARGE}
    deep:
      studio: ${CLEANING_PRICES_DEEP_STUDIO}
      one-plus-one: ${CLEANING_PRICES_DEEP_ONE_PLUS_ONE}
      two-plus-one: ${CLEANING_PRICES_DEEP_TWO_PLUS_ONE}
      three-plus-one: ${CLEANING_PRICES_DEEP_THREE_PLUS_ONE}
      four-plus-one: ${CLEANING_PRICES_DEEP_FOUR_PLUS_ONE}
      duplex-surcharge: ${CLEANING_PRICES_DEEP_DUPLEX_SURCHARGE}

referral:
  financial:
    commission-rate: ${REFERRAL_COMMISSION_RATE:0.15}
    customer:
      friend-discount-rate: ${REFERRAL_FRIEND_DISCOUNT_RATE:0.15}
      friend-max-discount: ${REFERRAL_FRIEND_MAX_DISCOUNT:2000}
      referrer-reward-rate: ${REFERRAL_REFERRER_REWARD_RATE:0.10}
      referrer-max-discount: ${REFERRAL_REFERRER_MAX_DISCOUNT:2000}
    partner:
      customer-discount-rate: ${REFERRAL_PARTNER_CUSTOMER_DISCOUNT_RATE:0.05}
      customer-max-discount: ${REFERRAL_PARTNER_CUSTOMER_MAX_DISCOUNT:2000}
      payout-rate: ${REFERRAL_PARTNER_PAYOUT_RATE:0.10}
      max-payout: ${REFERRAL_PARTNER_MAX_PAYOUT:2000}

onsite-issue:
  min-photos: ${ONSITE_ISSUE_MIN_PHOTOS:3}
  max-photos: ${ONSITE_ISSUE_MAX_PHOTOS:8}
  max-photo-size: ${ONSITE_ISSUE_MAX_PHOTO_SIZE:5MB}
  supported-content-types: ${ONSITE_ISSUE_SUPPORTED_CONTENT_TYPES:image/jpeg,image/png}

rental:
  min-stay-days: ${RENTAL_MIN_STAY_DAYS:7}
  long-term-min-days: ${RENTAL_LONG_TERM_MIN_DAYS:30}
  long-term-discount-rate: ${RENTAL_LONG_TERM_DISCOUNT_RATE:0.10}
  max-stay-days: ${RENTAL_MAX_STAY_DAYS:365}
  booking-start-months-ahead: ${RENTAL_BOOKING_START_MONTHS_AHEAD:6}
  max-active-bookings-per-customer: ${RENTAL_MAX_ACTIVE_BOOKINGS_PER_CUSTOMER:3}
  zone-id: Europe/Istanbul

rental-media:
  backfill-enabled: ${RENTAL_MEDIA_BACKFILL_ENABLED:true}
  backfill-batch-size: ${RENTAL_MEDIA_BACKFILL_BATCH_SIZE:10}
  cache-enabled: ${RENTAL_MEDIA_CACHE_ENABLED:true}
  cache-max-size: ${RENTAL_MEDIA_CACHE_MAX_SIZE:64MB}

transfer:
  min-booking-days-ahead: ${TRANSFER_MIN_BOOKING_DAYS_AHEAD:1}
  booking-months-ahead: ${TRANSFER_BOOKING_MONTHS_AHEAD:6}
  time-slot-minutes: ${TRANSFER_TIME_SLOT_MINUTES:30}
  zone-id: ${TRANSFER_ZONE_ID:Europe/Istanbul}
  assignment-mode: ${TRANSFER_ASSIGNMENT_MODE:ADMIN_ASSIGNMENT}
  driver-link:
    bot-username: ${TELEGRAM_BOT_USERNAME:go_cleany_bot}
    token-ttl: ${TRANSFER_DRIVER_LINK_TOKEN_TTL:24h}

rental-cleaning-benefit:
  issuance-enabled: ${RENTAL_CLEANING_BENEFIT_ENABLED:true}
  issuance-cron: "${RENTAL_CLEANING_BENEFIT_CRON:0 15 4 * * *}"
  issuance-batch-size: ${RENTAL_CLEANING_BENEFIT_BATCH_SIZE:100}
  checkout-window-days: ${RENTAL_CLEANING_CHECKOUT_WINDOW_DAYS:3}
  discount-rate: ${RENTAL_CLEANING_DISCOUNT_RATE:0.10}
  max-discount: ${RENTAL_CLEANING_MAX_DISCOUNT:2000}

smart-reminders:
  enabled: ${SMART_REMINDERS_ENABLED:true}
  cron: "${SMART_REMINDERS_CRON:0 0 9 * * *}"
  zone-id: ${SMART_REMINDERS_ZONE_ID:Europe/Istanbul}
  batch-size: ${SMART_REMINDERS_BATCH_SIZE:100}
  cleaning-grace-days: ${SMART_REMINDERS_CLEANING_GRACE_DAYS:7}
  rental-transfer-days-before: ${SMART_REMINDERS_RENTAL_TRANSFER_DAYS_BEFORE:3}
  transfer-days-before: ${SMART_REMINDERS_TRANSFER_DAYS_BEFORE:1}

data-retention:
  enabled: ${DATA_CLEANUP_ENABLED:true}
  days: ${DATA_RETENTION_DAYS:7}
  cron: "${DATA_CLEANUP_CRON:0 30 3 * * *}"
  batch-size: ${DATA_CLEANUP_BATCH_SIZE:100}
  max-batches-per-run: ${DATA_CLEANUP_MAX_BATCHES_PER_RUN:10}

cleaner:
  telegram-ids: ${CLEANER_TELEGRAM_IDS:}

admin:
  google-emails: ${ADMIN_GOOGLE_EMAILS:}

account-linking:
  telegram:
    mini-app-link-base: ${TELEGRAM_MINI_APP_LINK_BASE:}
    request-ttl: ${ACCOUNT_LINK_REQUEST_TTL:10m}

public-application:
  base-url: ${PUBLIC_APP_BASE_URL:https://loco-place.com}

analytics:
  zone-id: ${ANALYTICS_ZONE_ID:Europe/Istanbul}
  commercial-launch-at: ${COMMERCIAL_LAUNCH_AT:}

web-auth:
  google:
    enabled: ${GOOGLE_AUTH_ENABLED:false}
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}

telegram:
  bot-token: ${TELEGRAM_BOT_TOKEN}
  webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
  init-data-max-age: ${TELEGRAM_INIT_DATA_MAX_AGE:1h}
  init-data-allowed-clock-skew: ${TELEGRAM_INIT_DATA_ALLOWED_CLOCK_SKEW:30s}
  bot-enabled: ${TELEGRAM_BOT_ENABLED:true}
  api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
  update-mode: ${TELEGRAM_UPDATE_MODE:polling}
  polling-timeout-seconds: ${TELEGRAM_POLLING_TIMEOUT_SECONDS:25}
  polling-retry-delay: ${TELEGRAM_POLLING_RETRY_DELAY:3s}
  polling-drop-pending-updates: ${TELEGRAM_POLLING_DROP_PENDING_UPDATES:false}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
