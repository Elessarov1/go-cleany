spring:
  application:
    name: cleany-test

  datasource:
    driverClassName: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  liquibase:
    enabled: true
    database-change-log-table: cleany_changelog
    database-change-log-lock-table: cleany_changelog_lock

cleaning:
  booking-days-ahead: 7
  currency: TRY
  zone-id: Europe/Istanbul
  prices:
    regular:
      studio: 800
      one-plus-one: 900
      two-plus-one: 1100
      three-plus-one: 1350
      four-plus-one: 1650
      duplex-surcharge: 300
    deep:
      studio: 1200
      one-plus-one: 1400
      two-plus-one: 1700
      three-plus-one: 2050
      four-plus-one: 2450
      duplex-surcharge: 450

referral:
  financial:
    commission-rate: 0.15
    customer:
      friend-discount-rate: 0.15
      friend-max-discount: 2000
      referrer-reward-rate: 0.10
      referrer-max-discount: 2000
    partner:
      customer-discount-rate: 0.05
      customer-max-discount: 2000
      payout-rate: 0.10
      max-payout: 2000

onsite-issue:
  min-photos: 3
  max-photos: 8
  max-photo-size: 5MB
  supported-content-types: image/jpeg,image/png

rental:
  min-stay-days: 7
  long-term-min-days: 30
  long-term-discount-rate: 0.10
  max-stay-days: 365
  booking-start-months-ahead: 6
  max-active-bookings-per-customer: 3
  zone-id: Europe/Istanbul

rental-cleaning-benefit:
  issuance-enabled: false
  issuance-cron: "0 15 4 * * *"
  issuance-batch-size: 100
  checkout-window-days: 3
  discount-rate: 0.10
  max-discount: 2000

data-retention:
  enabled: false
  days: 7
  cron: "0 30 3 * * *"
  batch-size: 100
  max-batches-per-run: 10

cleaner:
  telegram-ids:
    - 123456789
    - 987654321

admin:
  telegram-ids:
    - 900001

telegram:
  bot-token: 123456789:test-token
  webhook-secret: test-not-configured
  init-data-max-age: 1h
  init-data-allowed-clock-skew: 30s
  bot-enabled: false
  api-base-url: https://api.telegram.org
  update-mode: polling
  polling-timeout-seconds: 25
  polling-retry-delay: 3s
  polling-drop-pending-updates: false

logging:
  level:
    root: ERROR
    com.cleany: DEBUG
    org.hibernate: ERROR
