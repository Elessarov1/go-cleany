plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.cleany'
version = '0.1.0-SNAPSHOT'

def defaultJarName = 'cleany-backend'

tasks {
    jar.enabled = false
    bootJar {
        archiveFileName.set(defaultJarName + '-' + version + '.jar')
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

sourceSets {
    performance {
        java.srcDir 'src/performance/java'
        resources.srcDir 'src/performance/resources'
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-session-jdbc'
    implementation 'com.googlecode.libphonenumber:libphonenumber:9.0.36'
    implementation 'net.coobird:thumbnailator:0.4.21'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.tngtech.archunit:archunit:1.5.0'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations.named('performanceImplementation') {
    extendsFrom configurations.implementation
}

configurations.named('performanceRuntimeOnly') {
    extendsFrom configurations.runtimeOnly
}

configurations.named('performanceCompileOnly') {
    extendsFrom configurations.compileOnly
}

configurations.named('performanceAnnotationProcessor') {
    extendsFrom configurations.annotationProcessor
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('performanceSeed', JavaExec) {
    group = 'performance'
    description = 'Recreates the deterministic dataset in the guarded local performance database.'
    dependsOn tasks.named('performanceClasses')
    classpath = sourceSets.performance.runtimeClasspath
    mainClass = 'com.cleany.performance.PerformanceDatasetApplication'
    environment 'SPRING_PROFILES_ACTIVE', 'local,performance'
    environment 'SMART_REMINDERS_ENABLED', 'false'
    environment 'DATA_CLEANUP_ENABLED', 'false'
    environment 'RENTAL_CLEANING_BENEFIT_ENABLED', 'false'
    environment 'TELEGRAM_BOT_ENABLED', 'false'
    environment 'TELEGRAM_BOT_TOKEN', 'performance-disabled'
    environment 'DB_URL', System.getenv('DB_URL')
            ?: 'jdbc:postgresql://127.0.0.1:15432/loco_performance?ApplicationName=loco-performance-seed'
    environment 'DB_USERNAME', System.getenv('DB_USERNAME') ?: 'loco_performance'
    environment 'DB_PASSWORD', System.getenv('DB_PASSWORD') ?: 'loco-performance-local-only'
    environment 'PERF_MANIFEST', System.getenv('PERF_MANIFEST')
            ?: file('../performance/results/manifest.json').absolutePath
}
