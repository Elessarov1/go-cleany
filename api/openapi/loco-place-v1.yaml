    StartRentalCleaningAction:
      type: object
      required: [type, rentalBookingId]
      properties:
        type: { type: string, const: START_RENTAL_CLEANING }
        rentalBookingId: { type: integer, format: int64 }
    StartRentalTransferAction:
      type: object
      required: [type, rentalBookingId, context]
      properties:
        type: { type: string, const: START_RENTAL_TRANSFER }
        rentalBookingId: { type: integer, format: int64 }
        context: { type: string, enum: [ARRIVAL, CHECKOUT, UNKNOWN] }
    OpenAdminTransactionAction:
      type: object
      required: [type, service, entityId]
      properties:
        type: { type: string, const: OPEN_ADMIN_TRANSACTION }
        service: { type: string, enum: [CLEANING, RENTAL, TRANSFER, UNKNOWN] }
        entityId: { type: integer, format: int64 }
    OpenSupportCaseAction:
      type: object
      required: [type, caseId]
      properties:
        type: { type: string, const: OPEN_SUPPORT_CASE }
        caseId: { type: integer, format: int64 }
    CustomerNotification:
      type: object
      required: [id, type, action, createdAt]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string }
        action: { $ref: '#/components/schemas/ActionTarget' }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
    CustomerActivityItem:
      type: object
      required: [service, entityId, status, titleRu, titleEn, subtitleRu, subtitleEn,
                 scheduledDate, occurredAt, money, action]
      properties:
        service: { type: string, enum: [CLEANING, RENTAL, TRANSFER, UNKNOWN] }
        entityId: { type: integer, format: int64 }
        status: { type: string }
        titleRu: { type: string }
        titleEn: { type: string }
        subtitleRu: { type: string }
        subtitleEn: { type: string }
        scheduledDate: { type: string, format: date }
        scheduledEndDate: { type: [string, 'null'], format: date }
        scheduledTime: { type: [string, 'null'], format: time }
        occurredAt: { type: string, format: date-time }
        money: { $ref: '#/components/schemas/Money' }
        action: { $ref: '#/components/schemas/ActionTarget' }
    CustomerActivity:
      type: object
      required: [activeAndUpcoming, history]
      properties:
        activeAndUpcoming:
          type: array
          items: { $ref: '#/components/schemas/CustomerActivityItem' }
        history:
          type: array
          items: { $ref: '#/components/schemas/CustomerActivityItem' }
    CustomerProfile:
      type: object
      required: [phone]
      properties:
        phone: { type: [string, 'null'] }
    PlatformServiceState:
      type: object
      required: [service, status, displayOrder, updatedAt, version]
      properties:
        service: { type: string, enum: [CLEANING, RENTAL, TRANSFER, UNKNOWN] }
        status: { type: string, enum: [ENABLED, IN_TEST, DISABLED, UNKNOWN] }
        displayOrder: { type: integer }
        updatedAt: { type: string, format: date-time }
        updatedByCustomerId: { type: [integer, 'null'], format: int64 }
        version: { type: integer, format: int64 }
    RentalTransferBenefit:
      type: object
      required: [type, discountRate]
      properties:
        type: { type: string, const: RENTAL_FIRST_TRANSFER }
        discountRate: { type: number }
    CustomerHomePrimaryAction:
      type: object
      required: [type, sourceService, sourceEntityId, targetService, relevantDate, action]
      properties:
        type:
          type: string
          enum: [RENTAL_TRANSFER_ARRIVAL, RENTAL_TRANSFER_CHECKOUT, RENTAL_CLEANING, UNKNOWN]
        sourceService: { type: string, enum: [CLEANING, RENTAL, TRANSFER, UNKNOWN] }
        sourceEntityId: { type: integer, format: int64 }
        targetService: { type: string, enum: [CLEANING, RENTAL, TRANSFER, UNKNOWN] }
        relevantDate: { type: string, format: date }
        eligibleFrom: { type: [string, 'null'], format: date }
        expiresOn: { type: [string, 'null'], format: date }
        action: { $ref: '#/components/schemas/ActionTarget' }
        benefit:
          oneOf:
            - $ref: '#/components/schemas/RentalTransferBenefit'
            - type: 'null'
    CustomerHomeRepeatOpportunity:
      type: object
      required: [service, sourceEntityId, sourceCompletedAt, action]
      properties:
        service: { type: string, enum: [CLEANING, RENTAL, TRANSFER, UNKNOWN] }
        sourceEntityId: { type: integer, format: int64 }
        sourceCompletedAt: { type: string, format: date-time }
        action: { $ref: '#/components/schemas/ActionTarget' }
    CustomerHome:
      type: object
      required: [hasActivity, activeTransactionCount]
      properties:
        hasActivity: { type: boolean }
        activeTransaction:
          oneOf:
            - $ref: '#/components/schemas/CustomerActivityItem'
            - type: 'null'
        activeTransactionCount: { type: integer, minimum: 0 }
        primaryAction:
          oneOf:
            - $ref: '#/components/schemas/CustomerHomePrimaryAction'
            - type: 'null'
        repeatOpportunity:
          oneOf:
            - $ref: '#/components/schemas/CustomerHomeRepeatOpportunity'
            - type: 'null'
    NotificationUnreadCount:
      type: object
      required: [unreadCount]
      properties:
        unreadCount: { type: integer, minimum: 0 }
    NotificationCursorPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CustomerNotification' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    ApiError:
      type: object
      required: [code, message, requestId]
      properties:
        code: { type: string }
        message: { type: string }
        fieldErrors:
          type: object
          additionalProperties: { type: string }
        requestId: { type: string }
