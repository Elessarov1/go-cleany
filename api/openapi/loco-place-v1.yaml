  /api/v1/transfer/bookings/{bookingId}/repeat-prefill:
    post:
      tags: [Transfer]
      operationId: getTransferRepeatPrefill
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      responses:
        '200':
          description: Verified repeat Transfer context
          content: { application/json: { schema: { $ref: '#/components/schemas/TransferRepeatPrefill' } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/transfer/bookings/{bookingId}/cancel:
    post:
      tags: [Transfer]
      operationId: cancelTransferBooking
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters: [{ $ref: '#/components/parameters/BookingId' }]
      responses:
        '200':
          description: Cancelled Transfer booking
          content: { application/json: { schema: { $ref: '#/components/schemas/TransferBooking' } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/account/support/sources/{service}/{sourceEntityId}:
    get:
      tags: [Support]
      operationId: getTransactionSupport
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Service'
        - { name: sourceEntityId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: Feedback and support state attached to an owned transaction
          content: { application/json: { schema: { $ref: '#/components/schemas/TransactionSupport' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/account/support/cases:
    post:
      tags: [Support]
      operationId: createSupportCase
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateSupportCaseRequest' } } }
      responses:
        '200':
          description: Existing open support case returned idempotently
          content: { application/json: { schema: { $ref: '#/components/schemas/SupportCase' } } }
        '201':
          description: Support case created
          content: { application/json: { schema: { $ref: '#/components/schemas/SupportCase' } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/account/support/feedback:
    post:
      tags: [Support]
      operationId: submitTransactionFeedback
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTransactionFeedbackRequest' } } }
      responses:
        '200':
          description: Updated transaction support state
          content: { application/json: { schema: { $ref: '#/components/schemas/TransactionSupport' } } }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  parameters:
    UuidId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    PageSize:
      name: size
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    BookingId:
      name: bookingId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PropertyId:
      name: propertyId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ExecutionId:
      name: executionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RentalTransferContext:
      name: context
      in: path
      required: true
      schema: { type: string, enum: [ARRIVAL, CHECKOUT] }
    Service:
      name: service
      in: path
      required: true
      schema: { type: string, enum: [CLEANING, RENTAL, TRANSFER] }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: First-party opaque access token. Provider credentials are never accepted here.
    cookieSession:
      type: apiKey
      in: cookie
      name: SESSION
      description: Browser/TMA HttpOnly session. Mutations also require X-XSRF-TOKEN.
    tmaBootstrap:
      type: apiKey
      in: header
      name: Authorization
      description: Authorization header uses `tma <initData>` only for the TMA session exchange.
  responses:
    BadRequest:
      description: Invalid request
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Unauthorized:
      description: Authentication failed
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Conflict:
      description: Business or security conflict
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    NotFound:
      description: Resource not found
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Gone:
      description: Retained private resource has expired
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  schemas:
    TelegramAcquisitionRequest:
      type: object
      required: [publicCode]
      properties:
        publicCode: { type: string, minLength: 1, maxLength: 64 }
    AcquisitionCapture:
      type: object
      required: [targetPath]
      properties:
        targetPath:
          type: string
          pattern: '^/(?!/)'
          description: Legacy channel-entry redirect, not a business read-model action.
    IdentityProvider:
      type: string
      enum: [GOOGLE, APPLE, TELEGRAM, UNKNOWN]
    CurrentAuthentication:
      type: object
      required: [authenticated, roles, loginProviders]
      properties:
        authenticated: { type: boolean }
        customerId: { type: [integer, 'null'], format: int64 }
        displayName: { type: [string, 'null'] }
        provider:
          anyOf:
            - { $ref: '#/components/schemas/IdentityProvider' }
            - { type: 'null' }
        roles:
          type: array
          uniqueItems: true
          items: { type: string, enum: [ADMIN, UNKNOWN] }
        loginProviders: { $ref: '#/components/schemas/LoginProviders' }
    LoginProviders:
      type: object
      required: [google]
      properties:
        google: { $ref: '#/components/schemas/LoginProviderAvailability' }
    LoginProviderAvailability:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
    CsrfToken:
      type: object
      required: [headerName, token]
      properties:
        headerName: { type: string, minLength: 1 }
        token: { type: string, minLength: 1 }
    CreateNativeChallengeRequest:
      type: object
      required: [provider, clientType]
      properties:
        provider: { $ref: '#/components/schemas/IdentityProvider' }
        clientType: { type: string, enum: [IOS, ANDROID, UNKNOWN] }
    NativeChallenge:
      type: object
      required: [challengeId, provider, nonce, expiresAt]
      properties:
        challengeId: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/IdentityProvider' }
        nonce: { type: string }
        expiresAt: { type: string, format: date-time }
    NativeProviderLoginRequest:
      type: object
      required: [challengeId, clientType, identityToken]
      properties:
        challengeId: { type: string, format: uuid }
        clientType: { type: string, enum: [IOS, ANDROID, UNKNOWN] }
        identityToken: { type: string }
        authorizationCode: { type: [string, 'null'] }
    SessionTokens:
      type: object
      required: [sessionId, tokenType, accessToken, refreshToken, accessExpiresAt, refreshExpiresAt, absoluteExpiresAt]
      properties:
        sessionId: { type: string, format: uuid }
        tokenType: { type: string, const: Bearer }
        accessToken: { type: string, pattern: '^lp_at_' }
        refreshToken: { type: string, pattern: '^lp_rt_' }
        accessExpiresAt: { type: string, format: date-time }
        refreshExpiresAt: { type: string, format: date-time }
        absoluteExpiresAt: { type: string, format: date-time }
    TelegramLoginAttempt:
      type: object
      required: [attemptId, botUrl, verifier, expiresAt]
      properties:
        attemptId: { type: string, format: uuid }
        botUrl: { type: string, format: uri }
        verifier: { type: string }
        expiresAt: { type: string, format: date-time }
    AccountIdentity:
      type: object
      required: [identityId, provider, issuer, linked, writeAccessAllowed]
      properties:
        identityId: { type: integer, format: int64 }
        provider: { $ref: '#/components/schemas/IdentityProvider' }
        issuer: { type: string, format: uri }
        linked: { type: boolean }
        username: { type: [string, 'null'] }
        writeAccessAllowed: { type: boolean }
    AccountIdentities:
      type: object
      required: [identities]
      properties:
        identities:
          type: array
          items: { $ref: '#/components/schemas/AccountIdentity' }
    IdentityLinkAttempt:
      type: object
      required: [id, provider, expiresAt]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/IdentityProvider' }
        nonce: { type: [string, 'null'] }
        reauthenticationNonce: { type: string }
        telegramDeepLink: { type: [string, 'null'], format: uri }
        expiresAt: { type: string, format: date-time }
    VerifyIdentityLinkRequest:
      type: object
      properties:
        identityToken: { type: [string, 'null'] }
        authorizationCode: { type: [string, 'null'] }
    ConfirmIdentityLinkRequest:
      type: object
      properties:
        identityToken: { type: [string, 'null'] }
        telegramInitData: { type: [string, 'null'] }
    SensitiveProof:
      type: object
      required: [challengeId]
      properties:
        challengeId: { type: string, format: uuid }
        identityToken: { type: [string, 'null'] }
        telegramInitData: { type: [string, 'null'] }
    ReauthenticationChallenge:
      type: object
      required: [id, provider, expiresAt]
      properties:
        id: { type: string, format: uuid }
        provider: { $ref: '#/components/schemas/IdentityProvider' }
        nonce: { type: [string, 'null'] }
        expiresAt: { type: string, format: date-time }
    NotificationPreferences:
      type: object
      required: [telegramEnabled, pushEnabled]
      properties:
        telegramEnabled: { type: boolean }
        pushEnabled: { type: boolean }
    RegisterCommunicationEndpointRequest:
      type: object
      required: [platform, registrationToken, installationId]
      properties:
        platform: { type: string, enum: [IOS, ANDROID, UNKNOWN] }
        registrationToken: { type: string, minLength: 1, maxLength: 4096 }
        installationId: { type: string, minLength: 1, maxLength: 128 }
        locale: { type: [string, 'null'], maxLength: 16 }
        appVersion: { type: [string, 'null'], maxLength: 32 }
    CommunicationEndpoint:
      type: object
      required: [id, type, platform, active]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [FCM, TELEGRAM, UNKNOWN] }
        platform: { type: string, enum: [IOS, ANDROID, TELEGRAM, UNKNOWN] }
        installationId: { type: [string, 'null'] }
        active: { type: boolean }
    ClientConfiguration:
      type: object
      required: [environment, iosApplicationId, androidApplicationId, minimumIosVersion, minimumAndroidVersion, apiRevision]
      properties:
        environment: { type: string }
        iosApplicationId: { type: string }
        androidApplicationId: { type: string }
        minimumIosVersion: { type: string }
        minimumAndroidVersion: { type: string }
        apiRevision: { type: string }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^-?[0-9]+(?:\.[0-9]{1,2})?$' }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    CleaningConfiguration:
      type: object
      required: [areas, apartmentTypes, duplexSurcharges, bookingDaysAhead, currency]
      properties:
        areas:
          type: array
          items: { type: string, enum: [MAHMUTLAR, KARGICAK, KESTEL, UNKNOWN] }
        apartmentTypes:
          type: array
          items: { $ref: '#/components/schemas/ApartmentPrice' }
        duplexSurcharges:
          type: object
          additionalProperties: { type: number }
        bookingDaysAhead: { type: integer, minimum: 1 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    ApartmentPrice:
      type: object
      required: [type, regularPrice, deepPrice]
      properties:
        type: { type: string, enum: [STUDIO, ONE_PLUS_ONE, TWO_PLUS_ONE, THREE_PLUS_ONE, FOUR_PLUS_ONE, UNKNOWN] }
        regularPrice: { type: number }
        deepPrice: { type: number }
    CleaningOrderQuoteRequest:
      type: object
      required: [apartmentType, duplex, cleaningType]
      properties:
        apartmentType: { type: string, enum: [STUDIO, ONE_PLUS_ONE, TWO_PLUS_ONE, THREE_PLUS_ONE, FOUR_PLUS_ONE, UNKNOWN] }
        duplex: { type: boolean }
        cleaningType: { type: string, enum: [REGULAR, DEEP, UNKNOWN] }
        referralCode: { type: [string, 'null'], maxLength: 32 }
        requestedDate: { type: [string, 'null'], format: date }
        rentalCleaningPromoCode: { type: [string, 'null'], maxLength: 32 }
    CleaningOrderQuote:
      type: object
      required: [basePrice, customerDiscount, finalCustomerPrice, customerDiscountType, currency]
      properties:
        basePrice: { type: number }
        customerDiscount: { type: number }
        finalCustomerPrice: { type: number }
        customerDiscountType: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    CleaningReportPhoto:
      type: object
      required: [id, url]
      properties:
        id: { type: integer, format: int64 }
        url: { type: string }
    CleaningReport:
      type: object
      required: [status, retentionDays, photos]
      properties:
        status: { type: string, enum: [NOT_READY, AVAILABLE, EXPIRED, UNKNOWN] }
        expiresAt: { type: [string, 'null'], format: date-time }
        retentionDays: { type: integer, minimum: 0 }
        cleanerComment: { type: [string, 'null'] }
        photos:
          type: array
          items: { $ref: '#/components/schemas/CleaningReportPhoto' }
    CleaningOrder:
      type: object
      required: [id, communicationIdentityId, customerName, phone, area, address, apartmentType,
                 duplex, cleaningType, price, basePrice, customerDiscount, finalCustomerPrice,
                 customerDiscountType, currency, requestedDate, status, createdAt, money]
      properties:
        id: { type: integer, format: int64 }
        communicationIdentityId: { type: integer, format: int64 }
        customerName: { type: string }
        phone: { type: string }
        area: { type: string, enum: [MAHMUTLAR, KARGICAK, KESTEL, UNKNOWN] }
        address: { type: string }
        apartmentType: { type: string, enum: [STUDIO, ONE_PLUS_ONE, TWO_PLUS_ONE, THREE_PLUS_ONE, FOUR_PLUS_ONE, UNKNOWN] }
        duplex: { type: boolean }
        cleaningType: { type: string, enum: [REGULAR, DEEP, UNKNOWN] }
        price: { type: number }
        basePrice: { type: number }
        customerDiscount: { type: number }
        finalCustomerPrice: { type: number }
        customerDiscountType: { type: string }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        requestedDate: { type: string, format: date }
        customerComment: { type: [string, 'null'] }
        cleanerComment: { type: [string, 'null'] }
        cleanerTelegramUserId: { type: [integer, 'null'], format: int64 }
        status:
          type: string
          enum: [NEW, ACCEPTED, AWAITING_REPORT, ONSITE_ISSUE_REPORTED, COMPLETED, REJECTED, CANCELLED, UNKNOWN]
        createdAt: { type: string, format: date-time }
        acceptedAt: { type: [string, 'null'], format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        report:
          oneOf:
            - $ref: '#/components/schemas/CleaningReport'
            - type: 'null'
        money: { $ref: '#/components/schemas/Money' }
    CleaningOrderCursorPage:
      type: object
      required: [items, hasMore]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CleaningOrder' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    CleaningRepeatPrefill:
      type: object
      required: [sourceOrderId, area, address, apartmentType, duplex, cleaningType]
      properties:
        sourceOrderId: { type: integer, format: int64 }
        area: { type: string, enum: [MAHMUTLAR, KARGICAK, KESTEL, UNKNOWN] }
        address: { type: string }
        apartmentType: { type: string, enum: [STUDIO, ONE_PLUS_ONE, TWO_PLUS_ONE, THREE_PLUS_ONE, FOUR_PLUS_ONE, UNKNOWN] }
        duplex: { type: boolean }
        cleaningType: { type: string, enum: [REGULAR, DEEP, UNKNOWN] }
    CleaningRepeatReminderRequest:
      type: object
      required: [selection]
      properties:
        selection: { type: string, enum: [IN_14_DAYS, IN_30_DAYS, DO_NOT_REMIND] }
    CleaningRepeatReminder:
      type: object
      required: [editable]
      properties:
        selection: { type: [string, 'null'], enum: [IN_14_DAYS, IN_30_DAYS, DO_NOT_REMIND, UNKNOWN, null] }
