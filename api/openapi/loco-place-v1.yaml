openapi: 3.1.0
info:
  title: Loco Place Public API
  version: 1.0.0-rc.1
  description: |
    Channel-neutral public contract for web, Telegram Mini App and native clients.
    Unknown enum values must be preserved by generated clients as UNKNOWN rather than causing decoding failure.
servers:
  - url: https://loco-place.com
tags:
  - name: Authentication
  - name: Account
  - name: Client
  - name: Platform
  - name: Support
  - name: Cleaning
  - name: Rental
  - name: Transfer
paths:
  /api/v1/acquisition/telegram:
    post:
      tags: [Client]
      operationId: captureTelegramAcquisition
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TelegramAcquisitionRequest' }
      responses:
        '200':
          description: Safe local entry target for the captured campaign
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AcquisitionCapture' }
  /api/v1/auth/tma/session:
    post:
      tags: [Authentication]
      operationId: createTmaSession
      security: [{ tmaBootstrap: [] }]
      responses:
        '204': { description: Cookie session created }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentAuthentication
      security: []
      responses:
        '200':
          description: Current first-party or anonymous browser authentication state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentAuthentication' }
  /api/v1/auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      security: []
      responses:
        '200':
          description: Cookie-session CSRF header and token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfToken' }
  /api/v1/auth/native/challenges:
    post:
      tags: [Authentication]
      operationId: createNativeChallenge
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateNativeChallengeRequest' }
      responses:
        '200':
          description: Nonce-bound login challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NativeChallenge' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/auth/native/google:
    post:
      tags: [Authentication]
      operationId: loginWithGoogle
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NativeProviderLoginRequest' }
      responses:
        '200':
          description: First-party native credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/native/apple:
    post:
      tags: [Authentication]
      operationId: loginWithApple
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NativeProviderLoginRequest' }
      responses:
        '200':
          description: First-party native credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/native/telegram/attempts:
    post:
      tags: [Authentication]
      operationId: createTelegramLoginAttempt
      security: []
      responses:
        '200':
          description: One-time bot handoff
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TelegramLoginAttempt' }
  /api/v1/auth/native/telegram/attempts/{attemptId}/exchange:
    post:
      tags: [Authentication]
      operationId: exchangeTelegramLoginAttempt
      security: []
      parameters:
        - name: attemptId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verifier, clientType]
              properties:
                verifier: { type: string, minLength: 1 }
                clientType: { type: string, enum: [IOS, ANDROID, UNKNOWN] }
      responses:
        '200':
          description: First-party native credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/sessions/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, pattern: '^lp_rt_' }
      responses:
        '200':
          description: Rotated credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionTokens' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/sessions/current:
    delete:
      tags: [Authentication]
      operationId: logoutCurrentSession
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      responses:
        '204': { description: Current session revoked }
  /api/v1/auth/sessions:
    delete:
      tags: [Authentication]
      operationId: revokeAllSessions
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      responses:
        '204': { description: Every customer session revoked }
  /api/v1/account/identities:
    get:
      tags: [Account]
      operationId: getAccountIdentities
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      responses:
        '200':
          description: Linked login methods
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountIdentities' }
  /api/v1/account/identity-links:
    post:
      tags: [Account]
      operationId: createIdentityLink
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { $ref: '#/components/schemas/IdentityProvider' }
      responses:
        '200':
          description: Link challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityLinkAttempt' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/account/identity-links/{id}/verify:
    post:
      tags: [Account]
      operationId: verifyIdentityLink
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters: [{ $ref: '#/components/parameters/UuidId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyIdentityLinkRequest' }
      responses:
        '204': { description: Target identity proved }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/account/identity-links/{id}/confirm:
    post:
      tags: [Account]
      operationId: confirmIdentityLink
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters: [{ $ref: '#/components/parameters/UuidId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmIdentityLinkRequest' }
      responses:
        '200':
          description: Identity linked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountIdentities' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/account/identities/{identityId}:
    delete:
      tags: [Account]
      operationId: unlinkIdentity
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters:
        - name: identityId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensitiveProof' }
      responses:
        '200':
          description: Identity unlinked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountIdentities' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/account/deletion-requests:
    post:
      tags: [Account]
      operationId: createAccountDeletionRequest
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      responses:
        '200':
          description: Fresh-auth challenge
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReauthenticationChallenge' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/account/deletion-requests/{id}/confirm:
    post:
      tags: [Account]
      operationId: confirmAccountDeletion
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters: [{ $ref: '#/components/parameters/UuidId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SensitiveProof' }
      responses:
        '204': { description: Account tombstoned and PII removed }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/account/notification-preferences:
    get:
      tags: [Account]
      operationId: getNotificationPreferences
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
    patch:
      tags: [Account]
      operationId: updateNotificationPreferences
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: Updated preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
  /api/v1/account/communication-endpoints:
    post:
      tags: [Account]
      operationId: registerCommunicationEndpoint
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterCommunicationEndpointRequest' }
      responses:
        '200':
          description: Endpoint registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommunicationEndpoint' }
    delete:
      tags: [Account]
      operationId: unregisterCommunicationEndpoint
      security: [{ bearerAuth: [] }]
      responses:
        '204': { description: Endpoint detached from current session }
  /api/v1/account/communication-endpoints/{id}:
    delete:
      tags: [Account]
      operationId: unregisterCommunicationEndpointById
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/UuidId' }]
      responses:
        '204': { description: Endpoint detached }
  /api/v1/account/notifications:
    get:
      tags: [Account]
      operationId: getNotifications
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: size
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Stable newest-first notification page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationCursorPage' }
  /api/v1/account/notifications/unread-count:
    get:
      tags: [Account]
      operationId: getNotificationUnreadCount
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      responses:
        '200':
          description: Current unread notification count
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationUnreadCount' }
  /api/v1/account/notifications/{notificationId}/read:
    post:
      tags: [Account]
      operationId: markNotificationRead
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters:
        - name: notificationId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '204': { description: Notification marked read }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/account/notifications/read-all:
    post:
      tags: [Account]
      operationId: markAllNotificationsRead
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      responses:
        '204': { description: Every customer notification marked read }
  /api/v1/account/activity:
    get:
      tags: [Account]
      operationId: getCustomerActivity
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      responses:
        '200':
          description: Cross-service active tasks and history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerActivity' }
  /api/v1/account/home:
    get:
      tags: [Account]
      operationId: getCustomerHome
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      responses:
        '200':
          description: Contextual customer home read model
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerHome' }
  /api/v1/customers/me:
    get:
      tags: [Account]
      operationId: getCustomerProfile
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      responses:
        '200':
          description: Current customer profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerProfile' }
  /api/v1/catalog/services:
    get:
      tags: [Platform]
      operationId: getPlatformServices
      security: []
      responses:
        '200':
          description: Services visible to the current customer context
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PlatformServiceState' }
  /api/v1/client/configuration:
    get:
      tags: [Client]
      operationId: getClientConfiguration
      security: []
      responses:
        '200':
          description: Public client compatibility settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClientConfiguration' }
  /api/v1/cleaning/orders:
    get:
      tags: [Cleaning]
      operationId: getCleaningOrders
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Stable newest-first Cleaning order page
          content: { application/json: { schema: { $ref: '#/components/schemas/CleaningOrderCursorPage' } } }
    post:
      tags: [Cleaning]
      operationId: createCleaningOrder
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateCleaningOrderRequest' } } }
      responses:
        '201':
          description: Cleaning order created
          content: { application/json: { schema: { $ref: '#/components/schemas/CleaningOrder' } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/cleaning/configuration:
    get:
      tags: [Cleaning]
      operationId: getCleaningConfiguration
      security: []
      responses:
        '200':
          description: Cleaning form and pricing configuration
          content: { application/json: { schema: { $ref: '#/components/schemas/CleaningConfiguration' } } }
  /api/v1/cleaning/orders/quote:
    post:
      tags: [Cleaning]
      operationId: quoteCleaningOrder
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CleaningOrderQuoteRequest' } } }
      responses:
        '200':
          description: Authoritative Cleaning quote
          content: { application/json: { schema: { $ref: '#/components/schemas/CleaningOrderQuote' } } }
  /api/v1/cleaning/orders/{orderId}:
    get:
      tags: [Cleaning]
      operationId: getCleaningOrder
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200':
          description: Customer-owned Cleaning order
          content: { application/json: { schema: { $ref: '#/components/schemas/CleaningOrder' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/cleaning/orders/{orderId}/repeat-shown:
    post:
      tags: [Cleaning]
      operationId: recordCleaningRepeatShown
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses: { '204': { description: Repeat opportunity impression recorded } }
  /api/v1/cleaning/orders/{orderId}/repeat-prefill:
    post:
      tags: [Cleaning]
      operationId: getCleaningRepeatPrefill
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200':
          description: Verified repeat-order context
          content: { application/json: { schema: { $ref: '#/components/schemas/CleaningRepeatPrefill' } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/cleaning/orders/{orderId}/repeat-reminder:
    get:
      tags: [Cleaning]
      operationId: getCleaningRepeatReminder
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200':
          description: Current repeat reminder selection
          content: { application/json: { schema: { $ref: '#/components/schemas/CleaningRepeatReminder' } } }
    put:
      tags: [Cleaning]
      operationId: updateCleaningRepeatReminder
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CleaningRepeatReminderRequest' } } }
      responses:
        '200':
          description: Updated repeat reminder selection
          content: { application/json: { schema: { $ref: '#/components/schemas/CleaningRepeatReminder' } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/cleaning/orders/{orderId}/cancel:
    post:
      tags: [Cleaning]
      operationId: cancelCleaningOrder
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200':
          description: Cancelled Cleaning order
          content: { application/json: { schema: { $ref: '#/components/schemas/CleaningOrder' } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/cleaning/orders/{orderId}/report:
    get:
      tags: [Cleaning]
      operationId: getCleaningReport
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters: [{ $ref: '#/components/parameters/OrderId' }]
      responses:
        '200':
          description: Retained completion report metadata
          content: { application/json: { schema: { $ref: '#/components/schemas/CleaningReport' } } }
        '410': { $ref: '#/components/responses/Gone' }
  /api/v1/cleaning/orders/{orderId}/report/photos/{mediaId}:
    get:
      tags: [Cleaning]
      operationId: getCleaningReportPhoto
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters:
        - $ref: '#/components/parameters/OrderId'
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Customer-owned private report photo; never publicly cacheable
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            image/*: { schema: { type: string, format: binary } }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
  /api/v1/referrals/me:
    get:
      tags: [Cleaning]
      operationId: getCleaningReferralSummary
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      responses:
        '200':
          description: Cleaning referral state for the current customer
          content: { application/json: { schema: { $ref: '#/components/schemas/ReferralSummary' } } }
  /api/v1/rental/bookings:
    get:
      tags: [Rental]
      operationId: getRentalBookings
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Stable newest-first Rental booking page
          content: { application/json: { schema: { $ref: '#/components/schemas/RentalBookingCursorPage' } } }
    post:
      tags: [Rental]
      operationId: createRentalBooking
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateRentalBookingRequest' } } }
      responses:
        '201':
          description: Rental booking created
          content: { application/json: { schema: { $ref: '#/components/schemas/RentalBooking' } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/rental/configuration:
    get:
      tags: [Rental]
      operationId: getRentalConfiguration
      security: []
      responses:
        '200':
          description: Rental stay policy and client limits
          content: { application/json: { schema: { $ref: '#/components/schemas/RentalConfiguration' } } }
  /api/v1/rental/search:
    get:
      tags: [Rental]
      operationId: searchRentalProperties
      security: []
      parameters:
        - { name: termType, in: query, required: false, schema: { $ref: '#/components/schemas/RentalTermType' } }
        - { name: checkInDate, in: query, required: false, schema: { type: string, format: date } }
        - { name: checkOutDate, in: query, required: false, schema: { type: string, format: date } }
        - { name: months, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: guests, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: cursor, in: query, required: false, schema: { type: string } }
        - { name: size, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 20, default: 20 } }
        - { name: X-Rental-Previous-Search-Id, in: header, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Public Rental search result; response is not cacheable
          content: { application/json: { schema: { $ref: '#/components/schemas/RentalSearch' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/rental/searches/{executionId}/opened:
    post:
      tags: [Rental]
      operationId: recordRentalSearchOpened
      security: []
      parameters: [{ $ref: '#/components/parameters/ExecutionId' }]
      responses: { '204': { description: Search-opened signal accepted } }
  /api/v1/rental/searches/{executionId}/first-card:
    post:
      tags: [Rental]
      operationId: recordRentalFirstCard
      security: []
      parameters: [{ $ref: '#/components/parameters/ExecutionId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RentalFirstCardRequest' } } }
      responses: { '204': { description: First-card performance signal accepted } }
  /api/v1/rental/properties/{slug}:
    get:
      tags: [Rental]
      operationId: getRentalProperty
      security: []
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Published Rental property
          content: { application/json: { schema: { $ref: '#/components/schemas/RentalProperty' } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/rental/properties/{propertyId}/availability:
    get:
      tags: [Rental]
      operationId: getRentalAvailability
      security: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - { name: fromDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: toDate, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: Unavailable date ranges within the requested interval
          content: { application/json: { schema: { $ref: '#/components/schemas/RentalAvailability' } } }
  /api/v1/rental/properties/{propertyId}/quote:
    get:
      tags: [Rental]
      operationId: quoteRentalProperty
      security: []
      parameters:
        - $ref: '#/components/parameters/PropertyId'
        - { name: termType, in: query, required: true, schema: { $ref: '#/components/schemas/RentalTermType' } }
        - { name: checkInDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: checkOutDate, in: query, required: false, schema: { type: string, format: date } }
