  /api/v1/transfer/quote:
    post:
      tags: [Transfer]
      operationId: quoteTransfer
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TransferQuoteRequest' } } }
      responses:
        '200':
          description: Authoritative Transfer quote
          content: { application/json: { schema: { $ref: '#/components/schemas/TransferQuote' } } }
  /api/v1/transfer/bookings/{bookingId}:
    get:
      tags: [Transfer]
      operationId: getTransferBooking
      security: [{ bearerAuth: [] }, { cookieSession: [] }]
