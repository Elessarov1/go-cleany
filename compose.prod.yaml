name: go-cleany

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16.14-alpine3.24
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 1m
    restart: unless-stopped
    logging: *default-logging

  backend:
    build:
      context: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?ApplicationName=go-cleany
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env.production}
      TELEGRAM_BOT_ENABLED: "true"
      TELEGRAM_UPDATE_MODE: ${TELEGRAM_UPDATE_MODE:-polling}
      TELEGRAM_POLLING_TIMEOUT_SECONDS: ${TELEGRAM_POLLING_TIMEOUT_SECONDS:-25}
      TELEGRAM_POLLING_RETRY_DELAY: ${TELEGRAM_POLLING_RETRY_DELAY:-3s}
      TELEGRAM_POLLING_DROP_PENDING_UPDATES: ${TELEGRAM_POLLING_DROP_PENDING_UPDATES:-false}
      TELEGRAM_INIT_DATA_MAX_AGE: ${TELEGRAM_INIT_DATA_MAX_AGE:-1h}
      TELEGRAM_INIT_DATA_ALLOWED_CLOCK_SKEW: ${TELEGRAM_INIT_DATA_ALLOWED_CLOCK_SKEW:-30s}
      CLEANER_TELEGRAM_IDS: ${CLEANER_TELEGRAM_IDS:?Set CLEANER_TELEGRAM_IDS in .env.production}
      TELEGRAM_MINI_APP_LINK_BASE: ${TELEGRAM_MINI_APP_LINK_BASE:?Set TELEGRAM_MINI_APP_LINK_BASE in .env.production}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-go_cleany_bot}
      ACCOUNT_LINK_REQUEST_TTL: ${ACCOUNT_LINK_REQUEST_TTL:-10m}
      PUBLIC_APP_BASE_URL: ${PUBLIC_APP_BASE_URL:-https://loco-place.com}
      ADMIN_GOOGLE_EMAILS: ${ADMIN_GOOGLE_EMAILS:-}
      GOOGLE_AUTH_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      WEB_SESSION_TIMEOUT: ${WEB_SESSION_TIMEOUT:-12h}
      WEB_SESSION_COOKIE_SECURE: "true"
      ANALYTICS_ZONE_ID: ${ANALYTICS_ZONE_ID:-Europe/Istanbul}
      COMMERCIAL_LAUNCH_AT: ${COMMERCIAL_LAUNCH_AT:-}
      TRANSFER_MIN_BOOKING_DAYS_AHEAD: ${TRANSFER_MIN_BOOKING_DAYS_AHEAD:-1}
      TRANSFER_BOOKING_MONTHS_AHEAD: ${TRANSFER_BOOKING_MONTHS_AHEAD:-6}
      TRANSFER_TIME_SLOT_MINUTES: ${TRANSFER_TIME_SLOT_MINUTES:-30}
      TRANSFER_ZONE_ID: ${TRANSFER_ZONE_ID:-Europe/Istanbul}
      TRANSFER_ASSIGNMENT_MODE: ${TRANSFER_ASSIGNMENT_MODE:-ADMIN_ASSIGNMENT}
      TRANSFER_DRIVER_LINK_TOKEN_TTL: ${TRANSFER_DRIVER_LINK_TOKEN_TTL:-24h}
      CLEANING_BOOKING_DAYS_AHEAD: ${CLEANING_BOOKING_DAYS_AHEAD:-7}
      CLEANING_PRICES_REGULAR_STUDIO: ${CLEANING_PRICES_REGULAR_STUDIO:?Set production prices}
      CLEANING_PRICES_REGULAR_ONE_PLUS_ONE: ${CLEANING_PRICES_REGULAR_ONE_PLUS_ONE:?Set production prices}
      CLEANING_PRICES_REGULAR_TWO_PLUS_ONE: ${CLEANING_PRICES_REGULAR_TWO_PLUS_ONE:?Set production prices}
      CLEANING_PRICES_REGULAR_THREE_PLUS_ONE: ${CLEANING_PRICES_REGULAR_THREE_PLUS_ONE:?Set production prices}
      CLEANING_PRICES_REGULAR_FOUR_PLUS_ONE: ${CLEANING_PRICES_REGULAR_FOUR_PLUS_ONE:?Set production prices}
      CLEANING_PRICES_REGULAR_DUPLEX_SURCHARGE: ${CLEANING_PRICES_REGULAR_DUPLEX_SURCHARGE:?Set production prices}
      CLEANING_PRICES_DEEP_STUDIO: ${CLEANING_PRICES_DEEP_STUDIO:?Set production prices}
      CLEANING_PRICES_DEEP_ONE_PLUS_ONE: ${CLEANING_PRICES_DEEP_ONE_PLUS_ONE:?Set production prices}
      CLEANING_PRICES_DEEP_TWO_PLUS_ONE: ${CLEANING_PRICES_DEEP_TWO_PLUS_ONE:?Set production prices}
      CLEANING_PRICES_DEEP_THREE_PLUS_ONE: ${CLEANING_PRICES_DEEP_THREE_PLUS_ONE:?Set production prices}
      CLEANING_PRICES_DEEP_FOUR_PLUS_ONE: ${CLEANING_PRICES_DEEP_FOUR_PLUS_ONE:?Set production prices}
      CLEANING_PRICES_DEEP_DUPLEX_SURCHARGE: ${CLEANING_PRICES_DEEP_DUPLEX_SURCHARGE:?Set production prices}
      REFERRAL_COMMISSION_RATE: ${REFERRAL_COMMISSION_RATE:-0.15}
      REFERRAL_FRIEND_DISCOUNT_RATE: ${REFERRAL_FRIEND_DISCOUNT_RATE:-0.15}
      REFERRAL_FRIEND_MAX_DISCOUNT: ${REFERRAL_FRIEND_MAX_DISCOUNT:-2000}
      REFERRAL_REFERRER_REWARD_RATE: ${REFERRAL_REFERRER_REWARD_RATE:-0.10}
      REFERRAL_REFERRER_MAX_DISCOUNT: ${REFERRAL_REFERRER_MAX_DISCOUNT:-2000}
      REFERRAL_PARTNER_CUSTOMER_DISCOUNT_RATE: ${REFERRAL_PARTNER_CUSTOMER_DISCOUNT_RATE:-0.05}
      REFERRAL_PARTNER_CUSTOMER_MAX_DISCOUNT: ${REFERRAL_PARTNER_CUSTOMER_MAX_DISCOUNT:-2000}
      REFERRAL_PARTNER_PAYOUT_RATE: ${REFERRAL_PARTNER_PAYOUT_RATE:-0.10}
      REFERRAL_PARTNER_MAX_PAYOUT: ${REFERRAL_PARTNER_MAX_PAYOUT:-2000}
      ONSITE_ISSUE_MIN_PHOTOS: ${ONSITE_ISSUE_MIN_PHOTOS:-3}
      ONSITE_ISSUE_MAX_PHOTOS: ${ONSITE_ISSUE_MAX_PHOTOS:-8}
      ONSITE_ISSUE_MAX_PHOTO_SIZE: ${ONSITE_ISSUE_MAX_PHOTO_SIZE:-5MB}
      ONSITE_ISSUE_SUPPORTED_CONTENT_TYPES: ${ONSITE_ISSUE_SUPPORTED_CONTENT_TYPES:-image/jpeg,image/png}
      RENTAL_MIN_STAY_DAYS: ${RENTAL_MIN_STAY_DAYS:-7}
      RENTAL_LONG_TERM_MIN_DAYS: ${RENTAL_LONG_TERM_MIN_DAYS:-30}
      RENTAL_LONG_TERM_DISCOUNT_RATE: ${RENTAL_LONG_TERM_DISCOUNT_RATE:-0.10}
      RENTAL_MAX_STAY_DAYS: ${RENTAL_MAX_STAY_DAYS:-365}
      RENTAL_BOOKING_START_MONTHS_AHEAD: ${RENTAL_BOOKING_START_MONTHS_AHEAD:-6}
      RENTAL_MAX_ACTIVE_BOOKINGS_PER_CUSTOMER: ${RENTAL_MAX_ACTIVE_BOOKINGS_PER_CUSTOMER:-3}
      RENTAL_MEDIA_CACHE_ENABLED: ${RENTAL_MEDIA_CACHE_ENABLED:-true}
      RENTAL_MEDIA_CACHE_MAX_SIZE: ${RENTAL_MEDIA_CACHE_MAX_SIZE:-64MB}
      RENTAL_CLEANING_BENEFIT_ENABLED: ${RENTAL_CLEANING_BENEFIT_ENABLED:-true}
      RENTAL_CLEANING_BENEFIT_CRON: "${RENTAL_CLEANING_BENEFIT_CRON:-0 15 4 * * *}"
      RENTAL_CLEANING_BENEFIT_BATCH_SIZE: ${RENTAL_CLEANING_BENEFIT_BATCH_SIZE:-100}
      RENTAL_CLEANING_CHECKOUT_WINDOW_DAYS: ${RENTAL_CLEANING_CHECKOUT_WINDOW_DAYS:-3}
      RENTAL_CLEANING_DISCOUNT_RATE: ${RENTAL_CLEANING_DISCOUNT_RATE:-0.10}
      RENTAL_CLEANING_MAX_DISCOUNT: ${RENTAL_CLEANING_MAX_DISCOUNT:-2000}
      SMART_REMINDERS_ENABLED: ${SMART_REMINDERS_ENABLED:-true}
      SMART_REMINDERS_CRON: "${SMART_REMINDERS_CRON:-0 0 9 * * *}"
      SMART_REMINDERS_ZONE_ID: ${SMART_REMINDERS_ZONE_ID:-Europe/Istanbul}
      SMART_REMINDERS_BATCH_SIZE: ${SMART_REMINDERS_BATCH_SIZE:-100}
      SMART_REMINDERS_CLEANING_GRACE_DAYS: ${SMART_REMINDERS_CLEANING_GRACE_DAYS:-7}
      SMART_REMINDERS_RENTAL_TRANSFER_DAYS_BEFORE: ${SMART_REMINDERS_RENTAL_TRANSFER_DAYS_BEFORE:-3}
      SMART_REMINDERS_TRANSFER_DAYS_BEFORE: ${SMART_REMINDERS_TRANSFER_DAYS_BEFORE:-1}
      DATA_CLEANUP_ENABLED: ${DATA_CLEANUP_ENABLED:-true}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-7}
      DATA_CLEANUP_CRON: "${DATA_CLEANUP_CRON:-0 30 3 * * *}"
      DATA_CLEANUP_BATCH_SIZE: ${DATA_CLEANUP_BATCH_SIZE:-100}
      DATA_CLEANUP_MAX_BATCHES_PER_RUN: ${DATA_CLEANUP_MAX_BATCHES_PER_RUN:-10}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70.0 -XX:+ExitOnOutOfMemoryError}
    expose:
      - "8080"
    networks:
      - app
      - data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *default-logging

  caddy:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /
        VITE_PREVIEW_MODE: "false"
    environment:
      APP_HOST: ${APP_HOST:?Set APP_HOST in .env.production}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - app
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

networks:
  edge:
  app:
  data:
    internal: true

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
