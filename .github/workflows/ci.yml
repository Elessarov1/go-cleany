name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    name: Detect application changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      app: ${{ steps.changes.outputs.app }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CURRENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          backend=false
          frontend=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # An explicit manual CI run intentionally validates the whole application.
            backend=true
            frontend=true
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base_sha="$PR_BASE_SHA"
              git diff --name-only "$base_sha...$CURRENT_SHA" > /tmp/changed-files
            else
              if [[ -z "$PUSH_BEFORE_SHA" || "$PUSH_BEFORE_SHA" =~ ^0+$ ]]; then
                # Safe fallback for the first push / missing before SHA.
                backend=true
                frontend=true
              else
                git diff --name-only "$PUSH_BEFORE_SHA..$CURRENT_SHA" > /tmp/changed-files
              fi
            fi

            if [[ -f /tmp/changed-files ]]; then
              echo "Changed files:"
              cat /tmp/changed-files

              if grep -q '^backend/' /tmp/changed-files; then
                backend=true
              fi
              if grep -q '^frontend/' /tmp/changed-files; then
                frontend=true
              fi
            fi
          fi

          app=false
          if [[ "$backend" == "true" || "$frontend" == "true" ]]; then
            app=true
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "backend=$backend frontend=$frontend app=$app"

  backend:
    name: Backend tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run backend tests
        working-directory: backend
        run: ./gradlew test --no-daemon

  frontend:
    name: Frontend build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy_staging:
    name: Deploy staging
    needs:
      - changes
      - backend
      - frontend
    if: >-
      always() &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.STAGING_DEPLOY_ENABLED == 'true' &&
      needs.changes.outputs.app == 'true' &&
      (needs.backend.result == 'success' || needs.backend.result == 'skipped') &&
      (needs.frontend.result == 'success' || needs.frontend.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: go-cleany-staging
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          : "${SSH_PRIVATE_KEY:?Missing STAGING_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing STAGING_SSH_KNOWN_HOSTS}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 </dev/null >/dev/null

      - name: Validate staging variables
        env:
          APP_HOST: ${{ vars.APP_HOST }}
          CLEANER_TELEGRAM_IDS: ${{ vars.CLEANER_TELEGRAM_IDS }}
          TELEGRAM_MINI_APP_LINK_BASE: ${{ vars.TELEGRAM_MINI_APP_LINK_BASE }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME || 'go_cleany_bot' }}
          TRANSFER_ASSIGNMENT_MODE: ${{ vars.TRANSFER_ASSIGNMENT_MODE || 'ADMIN_ASSIGNMENT' }}
          GOOGLE_AUTH_ENABLED: ${{ vars.GOOGLE_AUTH_ENABLED || 'false' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMIN_GOOGLE_EMAILS: ${{ secrets.ADMIN_GOOGLE_EMAILS }}
          WEB_SESSION_TIMEOUT: ${{ vars.WEB_SESSION_TIMEOUT || '12h' }}
          ANALYTICS_ZONE_ID: ${{ vars.ANALYTICS_ZONE_ID || 'Europe/Istanbul' }}
          COMMERCIAL_LAUNCH_AT: ${{ vars.COMMERCIAL_LAUNCH_AT || '' }}
          RENTAL_MIN_STAY_DAYS: ${{ vars.RENTAL_MIN_STAY_DAYS || '7' }}
          RENTAL_LONG_TERM_MIN_DAYS: ${{ vars.RENTAL_LONG_TERM_MIN_DAYS || '30' }}
          RENTAL_LONG_TERM_DISCOUNT_RATE: ${{ vars.RENTAL_LONG_TERM_DISCOUNT_RATE || '0.10' }}
          RENTAL_MAX_STAY_DAYS: ${{ vars.RENTAL_MAX_STAY_DAYS || '365' }}
          RENTAL_BOOKING_START_MONTHS_AHEAD: ${{ vars.RENTAL_BOOKING_START_MONTHS_AHEAD || '6' }}
          RENTAL_MAX_ACTIVE_BOOKINGS_PER_CUSTOMER: ${{ vars.RENTAL_MAX_ACTIVE_BOOKINGS_PER_CUSTOMER || '3' }}
          RENTAL_MEDIA_CACHE_ENABLED: ${{ vars.RENTAL_MEDIA_CACHE_ENABLED || 'true' }}
          RENTAL_MEDIA_CACHE_MAX_SIZE: ${{ vars.RENTAL_MEDIA_CACHE_MAX_SIZE || '64MB' }}
          RENTAL_TRANSFER_BENEFIT_ENABLED: ${{ vars.RENTAL_TRANSFER_BENEFIT_ENABLED || 'true' }}
          RENTAL_TRANSFER_BENEFIT_DISCOUNT_RATE: ${{ vars.RENTAL_TRANSFER_BENEFIT_DISCOUNT_RATE || '0.10' }}
          RENTAL_CLEANING_DISCOUNT_RATE: ${{ vars.RENTAL_CLEANING_DISCOUNT_RATE || '0.10' }}
          RENTAL_CLEANING_MAX_DISCOUNT: ${{ vars.RENTAL_CLEANING_MAX_DISCOUNT || '2000' }}
          DATA_CLEANUP_BATCH_SIZE: ${{ vars.DATA_CLEANUP_BATCH_SIZE || '100' }}
          DATA_CLEANUP_MAX_BATCHES_PER_RUN: ${{ vars.DATA_CLEANUP_MAX_BATCHES_PER_RUN || '10' }}
        run: |
          : "${APP_HOST:?Missing APP_HOST staging variable}"
          [[ "$APP_HOST" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]] || {
            echo "APP_HOST must contain only a valid hostname, without protocol or path." >&2
            exit 1
          }
          : "${CLEANER_TELEGRAM_IDS:?Missing CLEANER_TELEGRAM_IDS staging variable}"
          : "${TELEGRAM_MINI_APP_LINK_BASE:?Missing TELEGRAM_MINI_APP_LINK_BASE staging variable}"
          [[ "$GOOGLE_AUTH_ENABLED" == "true" || "$GOOGLE_AUTH_ENABLED" == "false" ]] || {
            echo "GOOGLE_AUTH_ENABLED must be true or false." >&2
            exit 1
          }
          if [[ "$GOOGLE_AUTH_ENABLED" == "true" ]]; then
            : "${GOOGLE_CLIENT_ID:?Missing GOOGLE_CLIENT_ID staging secret}"
            : "${GOOGLE_CLIENT_SECRET:?Missing GOOGLE_CLIENT_SECRET staging secret}"
            : "${ADMIN_GOOGLE_EMAILS:?Missing ADMIN_GOOGLE_EMAILS staging secret}"
          fi
          [[ "$WEB_SESSION_TIMEOUT" =~ ^[1-9][0-9]*(ms|s|m|h|d)$ ]] || {
            echo "WEB_SESSION_TIMEOUT must be a positive duration such as 30m or 12h." >&2
            exit 1
          }
          [[ "$ANALYTICS_ZONE_ID" =~ ^[A-Za-z_+-]+/[A-Za-z_+-]+$ ]] || {
            echo "ANALYTICS_ZONE_ID must be an IANA zone such as Europe/Istanbul." >&2
            exit 1
          }
          if [[ -n "$COMMERCIAL_LAUNCH_AT" ]]; then
            date --date="$COMMERCIAL_LAUNCH_AT" >/dev/null || {
              echo "COMMERCIAL_LAUNCH_AT must be an ISO-8601 timestamp with an offset." >&2
              exit 1
            }
          fi
          [[ "$CLEANER_TELEGRAM_IDS" =~ ^[0-9]+(,[0-9]+)*$ ]] || {
            echo "CLEANER_TELEGRAM_IDS must be comma-separated numeric Telegram IDs without spaces." >&2
            exit 1
          }
          [[ "$TELEGRAM_MINI_APP_LINK_BASE" == https://t.me/* ]] || {
            echo "TELEGRAM_MINI_APP_LINK_BASE must be an https://t.me/ Mini App link." >&2
            exit 1
          }
          [[ "$TELEGRAM_BOT_USERNAME" =~ ^[A-Za-z0-9_]{5,32}$ ]] || {
            echo "TELEGRAM_BOT_USERNAME must be a Telegram username without @." >&2
            exit 1
          }
          [[ "$TRANSFER_ASSIGNMENT_MODE" == "ADMIN_ASSIGNMENT" || "$TRANSFER_ASSIGNMENT_MODE" == "DRIVER_SELF_ACCEPT" ]] || {
            echo "TRANSFER_ASSIGNMENT_MODE must be ADMIN_ASSIGNMENT or DRIVER_SELF_ACCEPT." >&2
            exit 1
          }
          for variable in \
            RENTAL_MIN_STAY_DAYS \
            RENTAL_LONG_TERM_MIN_DAYS \
            RENTAL_MAX_STAY_DAYS \
            RENTAL_BOOKING_START_MONTHS_AHEAD \
            RENTAL_MAX_ACTIVE_BOOKINGS_PER_CUSTOMER \
            DATA_CLEANUP_BATCH_SIZE \
            DATA_CLEANUP_MAX_BATCHES_PER_RUN
          do
            [[ "${!variable}" =~ ^[1-9][0-9]*$ ]] || {
              echo "$variable must be a positive integer." >&2
              exit 1
            }
          done
          for variable in RENTAL_MEDIA_CACHE_ENABLED RENTAL_TRANSFER_BENEFIT_ENABLED; do
            [[ "${!variable}" == "true" || "${!variable}" == "false" ]] || {
              echo "$variable must be true or false." >&2
              exit 1
            }
          done
          [[ "$RENTAL_MEDIA_CACHE_MAX_SIZE" =~ ^[1-9][0-9]*(B|KB|MB|GB)$ ]] || {
            echo "RENTAL_MEDIA_CACHE_MAX_SIZE must be a positive data size such as 64MB." >&2
            exit 1
          }
          if [[ "$RENTAL_TRANSFER_BENEFIT_ENABLED" == "true" ]]; then
            [[ "$RENTAL_TRANSFER_BENEFIT_DISCOUNT_RATE" =~ ^0[.][0-9]*[1-9][0-9]*$ ]] || {
              echo "RENTAL_TRANSFER_BENEFIT_DISCOUNT_RATE must be greater than 0 and less than 1 when the benefit is enabled." >&2
              exit 1
            }
          fi
          [[ "$RENTAL_LONG_TERM_DISCOUNT_RATE" =~ ^0([.][0-9]+)?$ ]] || {
            echo "RENTAL_LONG_TERM_DISCOUNT_RATE must be greater than or equal to 0 and less than 1." >&2
            exit 1
          }
          [[ "$RENTAL_CLEANING_DISCOUNT_RATE" =~ ^0([.][0-9]+)?$ ]] || {
            echo "RENTAL_CLEANING_DISCOUNT_RATE must be greater than or equal to 0 and less than 1." >&2
            exit 1
          }
          [[ "$RENTAL_CLEANING_MAX_DISCOUNT" =~ ^[0-9]+([.][0-9]{1,2})?$ ]] || {
            echo "RENTAL_CLEANING_MAX_DISCOUNT must be a non-negative monetary amount." >&2
            exit 1
          }

      - name: Deploy exact revision
        env:
          SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          SSH_USER: ${{ vars.STAGING_SSH_USER }}
          APP_HOST: ${{ vars.APP_HOST }}
          CLEANER_TELEGRAM_IDS: ${{ vars.CLEANER_TELEGRAM_IDS }}
          TELEGRAM_MINI_APP_LINK_BASE: ${{ vars.TELEGRAM_MINI_APP_LINK_BASE }}
          TELEGRAM_BOT_USERNAME: ${{ vars.TELEGRAM_BOT_USERNAME || 'go_cleany_bot' }}
          TRANSFER_ASSIGNMENT_MODE: ${{ vars.TRANSFER_ASSIGNMENT_MODE || 'ADMIN_ASSIGNMENT' }}
          GOOGLE_AUTH_ENABLED: ${{ vars.GOOGLE_AUTH_ENABLED || 'false' }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMIN_GOOGLE_EMAILS: ${{ secrets.ADMIN_GOOGLE_EMAILS }}
          WEB_SESSION_TIMEOUT: ${{ vars.WEB_SESSION_TIMEOUT || '12h' }}
          ANALYTICS_ZONE_ID: ${{ vars.ANALYTICS_ZONE_ID || 'Europe/Istanbul' }}
          COMMERCIAL_LAUNCH_AT: ${{ vars.COMMERCIAL_LAUNCH_AT || '' }}
          RENTAL_MIN_STAY_DAYS: ${{ vars.RENTAL_MIN_STAY_DAYS || '7' }}
          RENTAL_LONG_TERM_MIN_DAYS: ${{ vars.RENTAL_LONG_TERM_MIN_DAYS || '30' }}
          RENTAL_LONG_TERM_DISCOUNT_RATE: ${{ vars.RENTAL_LONG_TERM_DISCOUNT_RATE || '0.10' }}
          RENTAL_MAX_STAY_DAYS: ${{ vars.RENTAL_MAX_STAY_DAYS || '365' }}
          RENTAL_BOOKING_START_MONTHS_AHEAD: ${{ vars.RENTAL_BOOKING_START_MONTHS_AHEAD || '6' }}
          RENTAL_MAX_ACTIVE_BOOKINGS_PER_CUSTOMER: ${{ vars.RENTAL_MAX_ACTIVE_BOOKINGS_PER_CUSTOMER || '3' }}
          RENTAL_MEDIA_CACHE_ENABLED: ${{ vars.RENTAL_MEDIA_CACHE_ENABLED || 'true' }}
          RENTAL_MEDIA_CACHE_MAX_SIZE: ${{ vars.RENTAL_MEDIA_CACHE_MAX_SIZE || '64MB' }}
          RENTAL_TRANSFER_BENEFIT_ENABLED: ${{ vars.RENTAL_TRANSFER_BENEFIT_ENABLED || 'true' }}
          RENTAL_TRANSFER_BENEFIT_DISCOUNT_RATE: ${{ vars.RENTAL_TRANSFER_BENEFIT_DISCOUNT_RATE || '0.10' }}
          RENTAL_CLEANING_DISCOUNT_RATE: ${{ vars.RENTAL_CLEANING_DISCOUNT_RATE || '0.10' }}
          RENTAL_CLEANING_MAX_DISCOUNT: ${{ vars.RENTAL_CLEANING_MAX_DISCOUNT || '2000' }}
          DATA_CLEANUP_BATCH_SIZE: ${{ vars.DATA_CLEANUP_BATCH_SIZE || '100' }}
          DATA_CLEANUP_MAX_BATCHES_PER_RUN: ${{ vars.DATA_CLEANUP_MAX_BATCHES_PER_RUN || '10' }}
        run: |
          : "${SSH_HOST:?Missing STAGING_SSH_HOST}"
          : "${SSH_PORT:?Missing STAGING_SSH_PORT}"
          : "${SSH_USER:?Missing STAGING_SSH_USER}"
          google_client_id_b64=$(printf '%s' "$GOOGLE_CLIENT_ID" | base64 -w 0)
          google_client_secret_b64=$(printf '%s' "$GOOGLE_CLIENT_SECRET" | base64 -w 0)
          admin_google_emails_b64=$(printf '%s' "$ADMIN_GOOGLE_EMAILS" | base64 -w 0)
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "cd /opt/go-cleany && \
            APP_HOST='$APP_HOST' \
            CLEANER_TELEGRAM_IDS='$CLEANER_TELEGRAM_IDS' \
            TELEGRAM_MINI_APP_LINK_BASE='$TELEGRAM_MINI_APP_LINK_BASE' \
            TELEGRAM_BOT_USERNAME='$TELEGRAM_BOT_USERNAME' \
            TRANSFER_ASSIGNMENT_MODE='$TRANSFER_ASSIGNMENT_MODE' \
            PUBLIC_APP_BASE_URL='https://$APP_HOST' \
            GOOGLE_AUTH_ENABLED='$GOOGLE_AUTH_ENABLED' \
            GOOGLE_CLIENT_ID=\$(printf '%s' '$google_client_id_b64' | base64 --decode) \
            GOOGLE_CLIENT_SECRET=\$(printf '%s' '$google_client_secret_b64' | base64 --decode) \
            ADMIN_GOOGLE_EMAILS=\$(printf '%s' '$admin_google_emails_b64' | base64 --decode) \
            WEB_SESSION_TIMEOUT='$WEB_SESSION_TIMEOUT' \
            ANALYTICS_ZONE_ID='$ANALYTICS_ZONE_ID' \
            COMMERCIAL_LAUNCH_AT='$COMMERCIAL_LAUNCH_AT' \
            RENTAL_MIN_STAY_DAYS='$RENTAL_MIN_STAY_DAYS' \
            RENTAL_LONG_TERM_MIN_DAYS='$RENTAL_LONG_TERM_MIN_DAYS' \
            RENTAL_LONG_TERM_DISCOUNT_RATE='$RENTAL_LONG_TERM_DISCOUNT_RATE' \
            RENTAL_MAX_STAY_DAYS='$RENTAL_MAX_STAY_DAYS' \
            RENTAL_BOOKING_START_MONTHS_AHEAD='$RENTAL_BOOKING_START_MONTHS_AHEAD' \
            RENTAL_MAX_ACTIVE_BOOKINGS_PER_CUSTOMER='$RENTAL_MAX_ACTIVE_BOOKINGS_PER_CUSTOMER' \
            RENTAL_MEDIA_CACHE_ENABLED='$RENTAL_MEDIA_CACHE_ENABLED' \
            RENTAL_MEDIA_CACHE_MAX_SIZE='$RENTAL_MEDIA_CACHE_MAX_SIZE' \
            RENTAL_TRANSFER_BENEFIT_ENABLED='$RENTAL_TRANSFER_BENEFIT_ENABLED' \
            RENTAL_TRANSFER_BENEFIT_DISCOUNT_RATE='$RENTAL_TRANSFER_BENEFIT_DISCOUNT_RATE' \
            RENTAL_CLEANING_DISCOUNT_RATE='$RENTAL_CLEANING_DISCOUNT_RATE' \
            RENTAL_CLEANING_MAX_DISCOUNT='$RENTAL_CLEANING_MAX_DISCOUNT' \
            DATA_CLEANUP_BATCH_SIZE='$DATA_CLEANUP_BATCH_SIZE' \
            DATA_CLEANUP_MAX_BATCHES_PER_RUN='$DATA_CLEANUP_MAX_BATCHES_PER_RUN' \
            ./deploy/scripts/release.sh '$GITHUB_SHA'"
