name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Run backend tests
        working-directory: backend
        run: ./gradlew test --no-daemon

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy_staging:
    name: Deploy staging
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.STAGING_DEPLOY_ENABLED == 'true'
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    concurrency:
      group: go-cleany-staging
      cancel-in-progress: false

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.STAGING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          : "${SSH_PRIVATE_KEY:?Missing STAGING_SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing STAGING_SSH_KNOWN_HOSTS}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -y -f ~/.ssh/id_ed25519 </dev/null >/dev/null

      - name: Deploy exact revision
        env:
          SSH_HOST: ${{ vars.STAGING_SSH_HOST }}
          SSH_PORT: ${{ vars.STAGING_SSH_PORT }}
          SSH_USER: ${{ vars.STAGING_SSH_USER }}
        run: |
          : "${SSH_HOST:?Missing STAGING_SSH_HOST}"
          : "${SSH_PORT:?Missing STAGING_SSH_PORT}"
          : "${SSH_USER:?Missing STAGING_SSH_USER}"
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -o StrictHostKeyChecking=yes \
            -i ~/.ssh/id_ed25519 \
            -p "$SSH_PORT" \
            "$SSH_USER@$SSH_HOST" \
            "cd /opt/go-cleany && ./deploy/scripts/release.sh '$GITHUB_SHA'"
